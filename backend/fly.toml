# fly launch --no-deploy --copy-config  then  fly volumes create wellness_data --size 1  then  fly deploy
app = "wellness-app"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  TIMEZONE = "Asia/Tokyo"
  INFERENCE_BACKEND = "agent_sdk"
  CLAUDE_MODEL = "claude-opus-5-5"

[[mounts]]
  source = "wellness_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
