# Public demo with synthetic data: fly deploy -c fly.demo.toml
app = "wellness-app-demo"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  TIMEZONE = "Asia/Tokyo"
  INFERENCE_BACKEND = "rules"
  DEMO_MODE = "true"

[[mounts]]
  source = "wellness_demo_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
